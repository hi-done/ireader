name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # electron 42 / @electron/rebuild 4 / @electron/get 5 / node-abi 4 均要求
          # node >= 22.12.0，用 20 只会刷 EBADENGINE 警告（不阻断安装，但已不受支持）
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm test
