name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: 校验 tag 与 package.json 版本一致
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION 与 package.json version $PKG_VERSION 不一致"
            exit 1
          fi

      - name: 缓存 Electron 二进制 (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}

      - name: 缓存 Electron 二进制 (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}

      - name: 安装依赖
        run: npm ci

      - name: 构建安装包
        # --publish never：禁止 electron-builder 在 CI + tag 环境下自动发布（默认 onTagOrDraft，
        # 无 GH_TOKEN 会报错）；发布统一交给下一步 action-gh-release
        # macOS 产物为 ad-hoc 签名（package.json mac.identity: "-"，无需证书；
        # hardenedRuntime: false 避免 ad-hoc + 库校验拒绝 Electron 预签名 framework 导致启动失败）。
        # 产物未公证：用户首次打开需在 系统设置 → 隐私与安全性 →「仍要打开」放行
        run: npm run build -- --publish never

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          # latest.yml 与 blockmap 是应用内「检查更新」的元数据（electron-updater 消费），
          # 缺失则更新功能不可用（对应《软件更新功能设计方案》§9.2）
          # latest-mac.yml：mac 检查更新时 electron-updater 必读的平台 channel 文件（404 即报检查失败）；
          # 它由 mac 的 zip target 产出，但 zip 本体与 mac blockmap 暂不上传（mac 无证书签名
          # 走不了 Squirrel.Mac 自动更新，检查到新版本只会跳浏览器下载，zip 无消费方）。
          # 将来加证书启用 mac 应用内更新时，再把 zip 与 zip.blockmap 补进本清单。
          files: |
            release/**/*.dmg
            release/*/IReader-*-win.exe
            release/*/IReader-*-win.exe.blockmap
            release/*/latest.yml
            release/*/latest-mac.yml
          # 本步骤在 mac / win 两个 matrix 任务中各执行一次（各自上传本平台产物），
          # generate_release_notes 仅由 Windows 任务开启：两边都开启时，第二次执行会把
          # 同一段生成说明再次叠加进 body（实测 v1.2.0 / v1.2.1 的 Full Changelog 段重复两遍）；
          # macOS 任务不生成说明，命中 action「已有 Release 未显式设置的信息键保留原值」的语义，
          # 无论两个任务的完成顺序如何，body 中都只会出现一份生成说明
          generate_release_notes: ${{ runner.os == 'Windows' }}
