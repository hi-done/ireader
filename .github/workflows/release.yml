name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 校验 tag 与 package.json 版本一致
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION 与 package.json version $PKG_VERSION 不一致"
            exit 1
          fi

      - name: 缓存 Electron 二进制 (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}

      - name: 缓存 Electron 二进制 (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}

      - name: 安装依赖
        run: npm ci

      - name: 构建安装包
        # --publish never：禁止 electron-builder 在 CI + tag 环境下自动发布（默认 onTagOrDraft，
        # 无 GH_TOKEN 会报错）；发布统一交给下一步 action-gh-release
        run: npm run build -- --publish never
        env:
          # 配置已 identity: null，此变量让 electron-builder 在 CI 上彻底跳过签名搜寻
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: 发布到 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/**/*.dmg
            release/**/*.exe
          generate_release_notes: true
